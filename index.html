<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>كاشير المقهى</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>☕ كاشير المقهى</h1>
        <p>نظام المبيعات</p>
    </header>

    <main>

        <!-- المنتجات -->
        <section class="products-section">

            <h2>المنتجات</h2>

            <div id="products" class="products">

                <!-- المنتجات ستظهر هنا بواسطة JavaScript -->

            </div>

        </section>


        <!-- الفاتورة -->
        <section class="cart-section">

            <h2>🧾 الفاتورة</h2>

            <div id="cart">

                <p class="empty-cart">
                    لم يتم اختيار أي منتج
                </p>

            </div>

            <div class="total">

                <span>المجموع:</span>

                <strong>
                    <span id="total">0</span> DA
                </strong>

            </div>

            <button id="checkout">
                إتمام البيع
            </button>

        </section>

    </main>


    <script src="script.js"></script>

</body>
</html>
